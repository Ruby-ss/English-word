    "meaning": "n. 线；跑道线",
    "example": "There is a finish line."
  },
  {
    "episode": 7,
    "word": "swim",
    "phonetic": "/swɪm/",
    "meaning": "v. 游泳",
    "example": "I swim fast."
  },
  {
    "episode": 7,
    "word": "dolphin",
    "phonetic": "/ˈdɒlfɪn/",
    "meaning": "n. 海豚",
    "example": "You lose, dolphin!"
  },
  {
    "episode": 7,
    "word": "skip",
    "phonetic": "/skɪp/",
    "meaning": "v. 跳绳；蹦跳",
    "example": "I can skip too."
  }
];

function initData() {
  try {
    currentUser = parseInt(localStorage.getItem('wordMemoryCurrentUser') || '1', 10);
    // 迁移：旧 key 数据 → user1 新 key（仅一次）
    if (currentUser === 1) {
      const oldSaved = localStorage.getItem('wordMemoryData');
      const oldVersion = localStorage.getItem('wordMemoryVersion');
      const newSaved = localStorage.getItem(userKey('wordMemoryData'));
      if (oldSaved && oldVersion === DATA_VERSION && !newSaved) {
        localStorage.setItem(userKey('wordMemoryData'), oldSaved);
        localStorage.setItem(userKey('wordMemoryVersion'), oldVersion);
        const oldEp = localStorage.getItem('wordMemoryEpisode');
        const oldHide = localStorage.getItem('wordHideMeaning');
        if (oldEp !== null) localStorage.setItem(userKey('wordMemoryEpisode'), oldEp);
        if (oldHide !== null) localStorage.setItem(userKey('wordHideMeaning'), oldHide);
      }
    }
    const saved = localStorage.getItem(userKey('wordMemoryData'));
    const savedVersion = localStorage.getItem(userKey('wordMemoryVersion'));
    if (saved && savedVersion === DATA_VERSION) {
      words = JSON.parse(saved);
      hideMeaning = localStorage.getItem(userKey('wordHideMeaning')) === 'true';
      currentEpisode = parseInt(localStorage.getItem(userKey('wordMemoryEpisode')) || '0', 10);
      return;
    }
  } catch (e) {
    console.warn('localStorage 读取失败');
  }
  const today = dateStr(new Date());
  words = defaultWords.map((w, i) => ({
    id: Date.now() + i,
    ...w,
    level: 0,
    nextReview: today,
    history: [],
    added: today,
  }));
  saveData();
  hideMeaning = false;
  currentEpisode = 0;
}

function saveData() {
  try {
    localStorage.setItem('wordMemoryCurrentUser', String(currentUser));
    localStorage.setItem(userKey('wordMemoryData'), JSON.stringify(words));
    localStorage.setItem(userKey('wordMemoryVersion'), DATA_VERSION);
    localStorage.setItem(userKey('wordMemoryEpisode'), String(currentEpisode));
    localStorage.setItem(userKey('wordHideMeaning'), String(hideMeaning));
  } catch (e) {
    console.warn('localStorage 不可用');
  }
}

function dateStr(d) {
  return d.toISOString().slice(0, 10);
}

function todayStr() { return dateStr(new Date()); }

function addDays(d, days) {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + days);
  return dateStr(nd);
}

function getReviewWords() {
  const t = todayStr();
  let list = words.filter(w => w.nextReview <= t);
  if (currentEpisode > 0) {
    list = list.filter(w => w.episode === currentEpisode);
  }
  // 排序：不会的次越多越靠前；相同则按下次复习日期升序
  const noCount = w => w.history.filter(h => h.result === 'no').length;
  return list.sort((a, b) => {
    const diff = noCount(b) - noCount(a);
    if (diff !== 0) return diff;
    return a.nextReview.localeCompare(b.nextReview);
  });
}

function getFilteredWords() {
  if (currentEpisode === 0) return words;
  return words.filter(w => w.episode === currentEpisode);
}

// ===== UI =====
function renderEpisodeBar() {
  const bar = document.getElementById('episodeBar');
  let html = `<div class="ep-btn ${currentEpisode === 0 ? 'active' : ''}" onclick="selectEpisode(0)">全部</div>`;
  EPISODES.forEach(ep => {
    const count = words.filter(w => w.episode === ep.ep).length;
    html += `<div class="ep-btn ${currentEpisode === ep.ep ? 'active' : ''}" title="${ep.en}" onclick="selectEpisode(${ep.ep})">${ep.title}(${count})</div>`;
  });
  bar.innerHTML = html;
}

function renderEpisodeTitle(container) {
  const banner = document.createElement('div');
  banner.className = 'episode-title';
  if (currentEpisode === 0) {
    banner.innerHTML = `<div class="ep-cn">全部单词</div><div class="ep-en">Big Muzzy · 共 ${EPISODES.length} 集</div>`;
  } else {
    const ep = EPISODES.find(e => e.ep === currentEpisode);
    if (!ep) return;
    banner.innerHTML = `<div class="ep-cn">${ep.title}</div><div class="ep-en">${ep.en}</div>`;
  }
  container.appendChild(banner);
}

function selectEpisode(ep) {
  currentEpisode = ep;
  saveData();
  render();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  render();
}

function render() {
  renderEpisodeBar();
  const container = document.getElementById('container');
  container.innerHTML = '';
  if (currentTab === 'settings') {
    renderSettings(container);
    return;
  }
  renderEpisodeTitle(container);
  if (currentTab === 'today') {
    const markedToday = countTodayMarked();
    if (markedToday > 0) {
      container.insertAdjacentHTML('beforeend',
        `<div class="restore-bar"><button class="restore-btn" onclick="restoreToday()">↩️ 还原今天已练的 ${markedToday} 个单词</button><div class="restore-hint">误点了「会 / 不会」？点这里把今天的单词重新显示出来</div></div>`);
    }
  }
  const list = currentTab === 'today' ? getReviewWords() : getFilteredWords();
  const totalFiltered = getFilteredWords().length;
  document.getElementById('stats').textContent = `今日 ${getReviewWords().length}/${totalFiltered}`;

  if (list.length === 0) {
    container.insertAdjacentHTML('beforeend', `
      <div class="empty-state">
        <div class="icon">🎉</div>
        <div>${currentTab === 'today' ? '今天没有要复习的单词！' : '该集暂无单词'}</div>
      </div>`);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'word-list-grid';
  list.forEach(w => {
    const el = document.createElement('div');
    el.className = 'word-card';
    el.dataset.id = w.id;
    const today = todayStr();

    let dotsHtml = '';
    REVIEW_INTERVALS.forEach((days, idx) => {
      const reviewDate = addDays(w.added, days);
      let cls = 'dot-future';
      let text = '';
      if (w.history[idx]) {
        cls = w.history[idx].result === 'ok' ? 'dot-ok' : 'dot-no';
        text = w.history[idx].result === 'ok' ? '✓' : '✕';
      } else if (reviewDate < today) {
        cls = 'dot-no'; text = '✕';
      }
      dotsHtml += `<div class="review-dot ${cls}">${text}</div>`;
    });

    const lastResult = w.history.length ? w.history[w.history.length - 1].result : null;
    const epLabel = w.episode ? `<span style="font-size:11px;color:#5b6cf9;background:#e8eaf6;padding:2px 6px;border-radius:10px;margin-left:6px;">第${w.episode}集</span>` : '';

    el.innerHTML = `
      <div class="word-header">
        <div>
          <div class="word-title" onclick="speak('${w.word.replace(/'/g, "\\'")}')">
            ${w.word}
            <span class="speaker">🔊</span>
            ${epLabel}
          </div>
          <div class="word-meta">${w.phonetic || ''} · ${w.nextReview === today ? '今天' : w.nextReview}</div>
        </div>
      </div>
      <div class="word-meaning ${hideMeaning ? 'hidden' : ''}" onclick="toggleHide(this)">${w.meaning}</div>
      ${w.example ? `<div class="word-example ${hideMeaning ? 'hidden' : ''}" onclick="toggleHide(this)">${highlightWord(w.example, w.word)}</div>` : ''}
      <div class="btn-row">
        <button class="btn btn-ok ${lastResult==='ok'?'solid':''}" onclick="markWord(${w.id},'ok')">✓ 会</button>
        <button class="btn btn-no ${lastResult==='no'?'solid':''}" onclick="markWord(${w.id},'no')">✕ 不会</button>
        <button class="btn btn-plain" onclick="speak('${w.word.replace(/'/g, "\\'")}')">🔊 发音</button>
        <button class="btn btn-plain" onclick="clozeMode(${w.id})">✏️ 挖空</button>
        <button class="btn btn-plain" onclick="showDetail(${w.id})">📋 详情</button>
        <button class="btn btn-plain" onclick="deleteWord(${w.id})">🗑 删除</button>
      </div>
      <div class="review-dots">
        <span class="dot-label">复习</span>
        ${dotsHtml}
      </div>
    `;
    wrap.appendChild(el);
  });
  container.appendChild(wrap);
}

function highlightWord(sentence, word) {
  const re = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}|${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').toLowerCase()})`, 'gi');
  return sentence.replace(re, '<b style="color:#5b6cf9">$1</b>');
}

function toggleHide(el) {
  if (hideMeaning) el.classList.toggle('hidden');
}

function renderSettings(container) {
  container.innerHTML = `
    <div class="word-card">
      <h3 style="margin-bottom:12px;">显示设置</h3>
      <div class="settings-row">
        <span>默认隐藏释义（点击显示）</span>
        <div class="toggle ${hideMeaning?'on':''}" onclick="toggleSetting(this,'hideMeaning')"></div>
      </div>
    </div>
    <div class="word-card">
      <h3 style="margin-bottom:12px;">数据管理</h3>
      <div class="settings-row" style="cursor:pointer;" onclick="exportData()">
        <span>📤 导出数据（JSON）</span>
        <span style="color:#999;">></span>
      </div>
      <div class="settings-row" style="cursor:pointer;" onclick="importData()">
        <span>📥 导入数据</span>
        <span style="color:#999;">></span>
      </div>
      <div class="settings-row danger" style="cursor:pointer;" onclick="resetData()">
        <span class="danger">🗑 重置为默认单词</span>
        <span style="color:#999;">></span>
      </div>
    </div>
    <div class="word-card">
      <h3 style="margin-bottom:12px;">关于</h3>
      <p style="font-size:13px;color:#888;line-height:1.6;">
        动物王国大冒险 核心词汇，共 ${defaultWords.length} 个单词。<br>
        基于艾宾浩斯遗忘曲线设计的背单词工具。<br>
        产品经理：Una班班 &nbsp;|&nbsp; 开发者：Mia&Ethan爸爸
      </p>
      <h4 style="margin:12px 0 8px;font-size:13px;color:#555;">使用说明</h4>
      <ul style="font-size:13px;color:#888;line-height:1.8;padding-left:16px;">
        <li>点击单词或 🔊 按钮可朗读发音</li>
        <li>切换顶部集数可分集复习，集标题会显示在列表上方</li>
        <li>不会的单词自动排在前面，方便重点复习</li>
        <li>数据保存在浏览器本地，清除缓存会丢失</li>
      </ul>
    </div>
  `;
}

function toggleSetting(el, key) {
  el.classList.toggle('on');
  if (key === 'hideMeaning') {
    hideMeaning = el.classList.contains('on');
    saveData();
    render();
  }
}

// ===== 操作 =====
function markWord(id, result) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  const today = todayStr();

  const oldHistory = [...w.history];
  const oldLevel = w.level;
  const oldNextReview = w.nextReview;

  w.history.push({ date: today, result });
  if (result === 'ok') {
    w.level = Math.min(w.level + 1, REVIEW_INTERVALS.length);
  } else {
    w.level = 0;
  }
  const interval = REVIEW_INTERVALS[Math.min(w.level, REVIEW_INTERVALS.length - 1)] || 1;
  w.nextReview = addDays(today, interval);
  saveData();

  if (currentTab === 'all') {
    showToast(result === 'ok' ? '已标记：会 ✓' : '已标记：不会 ✕', () => {
      w.history = oldHistory;
      w.level = oldLevel;
      w.nextReview = oldNextReview;
      saveData();
      render();
      showToast('已撤销');
    });
  } else {
    showToast(result === 'ok' ? '已标记：会 ✓' : '已标记：不会 ✕');
  }
  render();
}

function countTodayMarked() {
  const t = todayStr();
  let list = words;
  if (currentEpisode > 0) list = list.filter(w => w.episode === currentEpisode);
  return list.filter(w => w.history.some(h => h.date === t)).length;
}

function restoreToday() {
  const t = todayStr();
  let scope = words;
  if (currentEpisode > 0) scope = scope.filter(w => w.episode === currentEpisode);
  const targets = scope.filter(w => w.history.some(h => h.date === t));
  if (targets.length === 0) { showToast('今天还没有练过的单词'); return; }
  targets.forEach(w => {
    // 移除今天的复习记录，让复习进度回到练习前
    w.history = w.history.filter(h => h.date !== t);
    // 根据剩余历史重新计算熟练度
    let lvl = 0;
    w.history.forEach(h => { lvl = h.result === 'ok' ? Math.min(lvl + 1, REVIEW_INTERVALS.length) : 0; });
    w.level = lvl;
    // 让单词重新回到今天的复习列表
    w.nextReview = t;
  });
  saveData();
  render();
  showToast('已还原今天的 ' + targets.length + ' 个单词');
}

function speak(text) {
  if (!window.speechSynthesis) {
    showToast('当前设备不支持语音播放');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function clozeMode(id) {
  const w = words.find(x => x.id === id);
  if (!w || !w.example) { showToast('没有例句，无法挖空'); return; }
  const card = document.querySelector(`.word-card[data-id="${id}"]`);
  if (!card) return;
  const exEl = card.querySelector('.word-example');
  if (!exEl) return;

  const re = new RegExp(`(${w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}|${w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').toLowerCase()})`, 'gi');
  let inputIndex = 0;
  const html = w.example.replace(re, () => {
    const idx = inputIndex++;
    return `<input class="cloze-input" data-idx="${idx}" placeholder="?" oninput="checkCloze(this,'${w.word.replace(/'/g, "\\'")}')">`;
  });
  exEl.innerHTML = html;
  exEl.classList.remove('hidden');
  const firstInput = exEl.querySelector('input');
  if (firstInput) firstInput.focus();
}

function checkCloze(input, correct) {
  const val = input.value.trim().toLowerCase();
  if (val === correct.toLowerCase()) {
    input.style.borderColor = '#4caf50';
    input.style.color = '#2e7d32';
    if (input.nextElementSibling && input.nextElementSibling.tagName === 'INPUT') {
      input.nextElementSibling.focus();
    }
  } else if (val.length >= correct.length) {
    input.style.borderColor = '#f44336';
    input.style.color = '#c62828';
  } else {
    input.style.borderColor = '#ddd';
    input.style.color = '#333';
  }
}

function showDetail(id) {
  currentDetailId = id;
  const w = words.find(x => x.id === id);
  if (!w) return;
  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <p style="font-size:22px;font-weight:700;margin-bottom:4px;">${w.word}</p>
    <p style="color:#888;margin-bottom:12px;">${w.phonetic || ''}</p>
    <p style="margin-bottom:8px;"><b>释义：</b>${w.meaning}</p>
    ${w.example ? `<p style="margin-bottom:8px;color:#555;"><b>例句：</b>${w.example}</p>` : ''}
    <p style="margin-bottom:8px;color:#888;font-size:13px;"><b>集数：</b>第${w.episode || '?'}集</p>
    <p style="margin-bottom:8px;color:#888;font-size:13px;"><b>添加日期：</b>${w.added}</p>
    <p style="margin-bottom:8px;color:#888;font-size:13px;"><b>下次复习：</b>${w.nextReview}</p>
    <p style="color:#888;font-size:13px;"><b>复习记录：</b></p>
    <ul style="margin:6px 0 0 18px;color:#666;font-size:13px;line-height:1.8;">
      ${w.history.length ? w.history.map(h => `<li>${h.date}：${h.result==='ok'?'✓ 会':'✕ 不会'}</li>`).join('') : '<li>暂无记录</li>'}
    </ul>
  `;
  document.getElementById('detailModal').classList.add('show');
}

function deleteWord(id) {
  showConfirm('确定要删除这个单词吗？', () => {
    words = words.filter(w => w.id !== id);
    saveData();
    showToast('已删除');
    render();
  });
}

function deleteCurrentWord() {
  if (!currentDetailId) return;
  deleteWord(currentDetailId);
  closeModal('detailModal');
}

// ===== Modal =====
function openAddModal() {
  document.getElementById('inWord').value = '';
  document.getElementById('inPhonetic').value = '';
  document.getElementById('inMeaning').value = '';
  document.getElementById('inExample').value = '';
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('inWord').focus(), 100);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function saveWord() {
  const word = document.getElementById('inWord').value.trim();
  const phonetic = document.getElementById('inPhonetic').value.trim();
  const meaning = document.getElementById('inMeaning').value.trim();
  const example = document.getElementById('inExample').value.trim();
  if (!word || !meaning) { showToast('请填写单词和释义'); return; }
  const today = todayStr();
  words.push({
    id: Date.now(),
    word, phonetic, meaning, example,
    episode: currentEpisode || 0,
    level: 0, nextReview: today, history: [], added: today,
  });
  saveData();
  closeModal('addModal');
  showToast('添加成功');
  switchTab('all');
}

function showConfirm(msg, onOk) {
  document.getElementById('confirmBody').textContent = msg;
  const btn = document.getElementById('confirmBtn');
  btn.onclick = () => { closeModal('confirmModal'); onOk(); };
  document.getElementById('confirmModal').classList.add('show');
}

function resetData() {
  showConfirm('确定重置为默认单词？当前数据将丢失！', () => {
    try {
      localStorage.removeItem(userKey('wordMemoryData'));
      localStorage.removeItem(userKey('wordMemoryVersion'));
      localStorage.removeItem(userKey('wordMemoryEpisode'));
      localStorage.removeItem(userKey('wordHideMeaning'));
    } catch (e) {}
    initData();
    showToast('已重置');
    render();
  });
}

// ===== 导入导出 =====
function exportData() {
  const blob = new Blob([JSON.stringify(words, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'word-memory-' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('已导出');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) {
          words = data;
          saveData();
          showToast('导入成功');
          render();
        } else {
          showToast('文件格式错误');
        }
      } catch { showToast('文件解析失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===== Toast =====
let toastTimer = null;
function showToast(msg, onUndo) {
  const t = document.getElementById('toast');
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  if (onUndo) {
    t.innerHTML = `<span>${msg}</span><button class="toast-undo" onclick="this.parentElement.classList.remove('show')">撤销</button>`;
    const btn = t.querySelector('.toast-undo');
    btn.onclick = () => {
      t.classList.remove('show');
      if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
      onUndo();
    };
    toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
  } else {
    t.innerHTML = msg;
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
  t.classList.add('show');
}

// ===== 初始化 =====
initData();
render();

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
});
</script>
